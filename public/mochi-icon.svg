<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mochiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F472B6" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#mochiBg)"/>
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Cute Mochi Character Body -->
    <ellipse cx="0" cy="10" rx="140" ry="110" fill="#FFFFFF"/>
    <!-- Blush cheeks -->
    <ellipse cx="-75" cy="20" rx="18" ry="12" fill="#FBCFE8"/>
    <ellipse cx="75" cy="20" rx="18" ry="12" fill="#FBCFE8"/>
    <!-- Eyes -->
    <ellipse cx="-45" cy="0" rx="10" ry="14" fill="#374151"/>
    <ellipse cx="45" cy="0" rx="10" ry="14" fill="#374151"/>
    <circle cx="-42" cy="-4" r="4" fill="#FFFFFF"/>
    <circle cx="48" cy="-4" r="4" fill="#FFFFFF"/>
    <!-- Happy Smile -->
    <path d="M -16 22 Q 0 36 16 22" stroke="#374151" stroke-width="6" stroke-linecap="round" fill="none"/>
    <!-- Coin -->
    <circle cx="90" cy="-60" r="32" fill="#F59E0B"/>
    <circle cx="90" cy="-60" r="24" fill="#FBBF24"/>
    <text x="90" y="-52" font-family="Inter, sans-serif" font-weight="900" font-size="24" fill="#B45309" text-anchor="middle">₱</text>
  </g>
</svg>
